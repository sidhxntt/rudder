[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rudder-cli"
version = "0.1.0"
description = "rudder — command line client for the Rudder control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.23.1,<0.29.0",
    "rudder-sdk",
]

[project.scripts]
rudder = "rudder_cli.main:main"

# The SDK is a sibling directory, not a published package.
[tool.uv.sources]
rudder-sdk = { path = "../sdk-python", editable = true }

[tool.setuptools.packages.find]
include = ["rudder_cli*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
