[project]
name = "rudder-cp"
version = "0.1.0"
description = "Rudder control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (final release, 2020) probes its bcrypt backend by hashing a
    # >72-byte secret. bcrypt 5.0 hard-rejects that, so every hash_password call
    # raises. Pin below 5 until passlib is replaced.
    "bcrypt>=4,<6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "kubernetes-asyncio>=32.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rudder_cp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
