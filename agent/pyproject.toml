[project]
name = "rudder-agent"
version = "0.1.0"
description = "Rudder node agent — owns actual state on one host"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "docker>=7.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rudder_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
