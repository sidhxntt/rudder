# A cluster-scoped issuer lets every isolated Rudder environment request a
# certificate without receiving Cloud DNS credentials. cert-manager's own
# ServiceAccount is linked to the narrowly scoped GSA through Workload
# Identity; ambient credentials are intentional here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${RUDDER_KUBERNETES_CERTIFICATE_ISSUER}
spec:
  acme:
    email: ${RUDDER_ACME_EMAIL}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: ${RUDDER_KUBERNETES_CERTIFICATE_ISSUER}-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: ${RUDDER_GCP_PROJECT}
            # The parent zone may be hosted elsewhere. Pin DNS-01 writes to
            # Rudder's delegated Cloud DNS child zone instead of letting
            # cert-manager select the broader parent suffix.
            hostedZoneName: ${RUDDER_GCP_DNS_ZONE}
