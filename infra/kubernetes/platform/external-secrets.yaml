# External Secrets never receives node credentials or the control-plane GSA.
# It impersonates only this Kubernetes ServiceAccount, which Terraform binds to
# a dedicated GSA with access to one Secret Manager secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rudder-secret-sync
  namespace: rudder-system
  annotations:
    iam.gke.io/gcp-service-account: ${RUDDER_SECRET_SYNC_GSA}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rudder-gcp-secret-manager
  namespace: rudder-system
spec:
  provider:
    gcpsm:
      projectID: ${RUDDER_GCP_PROJECT}
      auth:
        workloadIdentity:
          clusterProjectID: ${RUDDER_GCP_PROJECT}
          clusterLocation: ${RUDDER_GCP_REGION}
          clusterName: ${RUDDER_GKE_CLUSTER}
          serviceAccountRef:
            name: rudder-secret-sync
---
# The remote Secret Manager version is JSON with keys named after RUDDER_* env
# variables (for example RUDDER_SECRET_KEYS, RUDDER_JWT_SECRET, and GitHub
# credentials). Values are supplied out of band and are never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rudder-control-plane-runtime
  namespace: rudder-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rudder-gcp-secret-manager
    kind: SecretStore
  target:
    name: rudder-control-plane-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ${RUDDER_CONTROL_PLANE_SECRET_NAME}
