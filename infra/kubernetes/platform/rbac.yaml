apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rudder-environment-reconciler
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    # Environment deletion is namespace deletion: Kubernetes then removes its
    # PVCs, ingress/certificate, quota and all namespaced workloads together.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    # Candidate cleanup is constrained by Rudder's release label. Kubernetes
    # authorizes ``deletecollection`` separately from ordinary ``delete``.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
    # This grant is only for the control-plane reconciler. Environment
    # ``rudder-workload`` ServiceAccounts intentionally receive no Role or
    # RoleBinding, so tenant Pods retain Kubernetes' default-deny RBAC.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Readiness uses the status subresource, which Kubernetes authorizes
  # independently from the parent Pod resource.
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  # Runtime tails are read through the Kubernetes API, never by granting the
  # control plane node or Docker credentials.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # metrics-server backs ``metrics.k8s.io/v1beta1/pods``. This is read-only
  # Pod usage used for the bounded Rudder runtime-metric history.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rudder-environment-reconciler
subjects:
  - kind: ServiceAccount
    name: rudder-control-plane
    namespace: rudder-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rudder-environment-reconciler
---
# This role deliberately has no binding. An operator must create a time-bound
# binding outside Rudder before a destructive volume operation is possible.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rudder-break-glass-volume-admin
  labels:
    rudder.invytt.com/break-glass: "true"
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete"]
