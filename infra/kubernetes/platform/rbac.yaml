apiVersion: v1
kind: ServiceAccount
metadata:
  name: rudder-control-plane
  namespace: rudder-system
  labels:
    app.kubernetes.io/part-of: rudder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rudder-environment-reconciler
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    # Candidate cleanup is constrained by Rudder's release label. Kubernetes
    # authorizes ``deletecollection`` separately from ordinary ``delete``.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Readiness uses the status subresource, which Kubernetes authorizes
  # independently from the parent Pod resource.
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rudder-environment-reconciler
subjects:
  - kind: ServiceAccount
    name: rudder-control-plane
    namespace: rudder-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rudder-environment-reconciler
---
# This role deliberately has no binding. An operator must create a time-bound
# binding outside Rudder before a destructive volume operation is possible.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rudder-break-glass-volume-admin
  labels:
    rudder.invytt.com/break-glass: "true"
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete"]
