# Traefik static config. Dynamic config is generated by the control plane into
# ./dynamic, one file per Domain row (D15). Traefik watches that directory.

entryPoints:
  web:
    address: ":80"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: true # dev only, port 8080

log:
  level: INFO

accessLog: {}

# TLS is off in dev (D8). With RUDDER_TLS_MODE=acme the control plane also
# writes a certResolver block and routers gain a `tls` section.
