# Optional override for `make kind-control-plane`. It is deliberately separate
# from docker-compose.dev.yml so normal Docker-runtime development does not
# require a local Kubernetes credential.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rudder-local
      MINIO_ROOT_PASSWORD: rudder-local-backup-password
    volumes:
      - miniodata:/data
    networks: [rudder]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until mc alias set local http://minio:9000 rudder-local rudder-local-backup-password; do sleep 1; done;
        mc mb --ignore-existing local/rudder-backups
    networks: [rudder]

  control-plane:
    environment:
      RUDDER_RUNTIME: kubernetes
      RUDDER_REGISTRY: kind-registry:5000
      RUDDER_KUBERNETES_KUBECONFIG: /kube/config
      RUDDER_KUBERNETES_POSTGRES_OPERATOR: cloudnativepg
      # Local Kind only: the same private endpoint is attached to the Kind
      # network by bootstrap.sh so both CNPG pods and the control plane reach
      # it by service name. Production supplies its own object-store values.
      RUDDER_KUBERNETES_BACKUP_S3_ENDPOINT: http://minio:9000
      RUDDER_KUBERNETES_BACKUP_S3_BUCKET: rudder-backups
      RUDDER_KUBERNETES_BACKUP_S3_ACCESS_KEY: rudder-local
      RUDDER_KUBERNETES_BACKUP_S3_SECRET_KEY: rudder-local-backup-password
      RUDDER_KUBERNETES_BACKUP_S3_REGION: us-east-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/kind/kubeconfig:/kube/config:ro

volumes:
  miniodata:
